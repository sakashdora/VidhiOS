[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  SECRETS_SCAN_ENABLED = "false"
  SECRETS_SCAN_OMIT_KEYS = "GEMINI_API_KEY,NVIDIA_FAST_MODEL,NVIDIA_MODEL,APP_URL"
  SECRETS_SCAN_OMIT_PATHS = ".env.example,src/components/ResearchModule.tsx,src/server/geminiService.ts,src/server/nvidiaService.ts"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "microphone=(self), camera=(), geolocation=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
